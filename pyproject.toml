[project]
name = "lol-churn-data-pipeline"
version = "0.1.0"
description = "End-to-end data pipeline for League of Legends player churn analysis using Riot APIs, PostgreSQL and a Bronze/Silver/Gold architecture"
readme = "README.md"
authors = [
    { name = "Henar", email = "alvp.henar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
lol-churn-data-pipeline = "lol_churn_data_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pgcli>=4.5.0",
]
